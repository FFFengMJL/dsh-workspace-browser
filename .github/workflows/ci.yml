name: CI

# Every push and pull request verifies the same artifact the release workflow
# publishes: a packed tarball that DSH can install without a build step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The job only reads the tree; no token should survive in .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          # Must match packageManager in package.json.
          version: 12.15.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Latest 22.x LTS. The locked tsdown/vitest require >=22.18 / >=22.12.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + unit tests + build + loader smoke test, then a real pack and
      # an unpacked-package check (manifest, file set, loader contract, checksum).
      - run: pnpm verify

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsh-workspace-browser-package
          path: |
            .release/*.tgz
            .release/*.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
