name: CI

# Every push and pull request verifies the same artifact the release workflow
# publishes: a packed tarball that DSH can install without a build step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The job only reads the tree; no token should survive in .git/config.
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          # Must match packageManager in package.json.
          version: 12.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Latest 22.x LTS. The locked tsdown/vitest require >=22.18 / >=22.12.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + unit tests + build + loader smoke test, then a real pack and
      # an unpacked-package check (manifest, file set, loader contract, checksum).
      - run: pnpm verify

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-workspace-browser-package
          path: |
            .release/*.tgz
            .release/*.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
